<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDU 2026 Companion</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse CSV Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary: #f26522; /* TDU Orange */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-dark: #333;
            --text-light: #666;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #events-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            position: relative;
        }

        .event-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
            padding-right: 35px;
            line-height: 1.3;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .event-meta i {
            width: 16px;
            color: var(--primary);
        }

        .event-desc {
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
            color: #444;
        }

        .tag {
            display: inline-block;
            background: #ffe8dd;
            color: var(--primary);
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover {
            background: #e8e8e8;
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.3rem;
            color: #ccc;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.2s;
        }
        .fav-btn.saved {
            color: #ff3b30;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: var(--primary);
        }
        
        #loader {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>TDU 2026</h1>
        <p>Interactive Companion</p>
    </header>

    <div class="filters" id="filter-container">
        <div class="filter-btn active" onclick="filterEvents('All', this)">All Events</div>
        <div class="filter-btn" onclick="filterEvents('Group Ride', this)">Group Rides</div>
        <div class="filter-btn" onclick="filterEvents('Official Event', this)">Official Events</div>
        <div class="filter-btn" onclick="filterEvents('Social', this)">Social & Parties</div>
        <div class="filter-btn" onclick="filterEvents('Women', this)">Women's</div>
    </div>

    <div id="events-container">
        <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading Events...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('all')" id="nav-all">
            <i class="fas fa-calendar-alt"></i>
            Schedule
        </div>
        <div class="nav-item" onclick="switchTab('saved')" id="nav-saved">
            <i class="fas fa-heart"></i>
            My Itinerary
        </div>
    </div>

    <script>
        const RAW_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_acwLQlGitpXd_GxJvx3GNjq1ZZJ80_2C7A_Xdya6z-Dn_vphi4PBa7emQqAroD1-cmwh8vscbwgA/pub?output=csv";
        
        // Proxy list with direct URL prioritized
        const PROXIES = [
            RAW_SHEET_URL,
            "https://corsproxy.io/?" + encodeURIComponent(RAW_SHEET_URL),
            "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(RAW_SHEET_URL)
        ];

        let allEvents = [];
        let currentFilter = 'All';
        let currentTab = 'all';

        // Clean markdown links like [https://strava.com](https://strava.com)
        function cleanUrl(val) {
            if (!val) return '';
            val = String(val).trim();
            const m = val.match(/\((https?:\/\/[^\)]+)\)/);
            if (m) return m[1];
            const m2 = val.match(/https?:\/\/[^\s\]\)]+/);
            if (m2) return m2[0];
            return val;
        }

        // Clean time formats like 07:30:00 -> 07:30
        function formatTime(timeStr) {
            if (!timeStr) return '';
            timeStr = String(timeStr).trim();
            if (timeStr.match(/^\d{2}:\d{2}:\d{2}$/)) {
                return timeStr.substring(0, 5);
            }
            return timeStr;
        }

        // Clean date formats like 2026-01-16 -> Fri, 16 Jan
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = String(dateStr).trim().split('-');
            if (parts.length === 3) {
                const year = parseInt(parts[0]);
                const month = parseInt(parts[1]) - 1;
                const day = parseInt(parts[2]);
                const d = new Date(year, month, day);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
                }
            }
            return dateStr;
        }

        // Case/space invariant field lookup
        function getFieldValue(obj, ...possibleKeys) {
            if (!obj) return '';
            const normalizedKeys = possibleKeys.map(k => k.toLowerCase().replace(/[^a-z0-9]/g, ''));
            for (let prop in obj) {
                const normProp = prop.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (normalizedKeys.includes(normProp) && obj[prop]) {
                    return String(obj[prop]).trim();
                }
            }
            return '';
        }

        async function fetchEvents() {
            let csvText = null;

            for (let url of PROXIES) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const text = await response.text();
                    
                    // Ignore HTML responses (proxy error pages)
                    if (text.trim().toLowerCase().startsWith("<!doctype") || text.trim().toLowerCase().startsWith("<html")) {
                        continue;
                    }
                    
                    if (text.includes(",") && text.length > 20) {
                        csvText = text;
                        break;
                    }
                } catch (e) {
                    console.warn("Proxy attempt failed:", url);
                }
            }

            if (!csvText) {
                document.getElementById('events-container').innerHTML = 
                    `<p style='text-align:center; padding:20px; color:red;'>Could not connect to Google Sheet. Check that the sheet is set to 'Publish to Web'.</p>`;
                return;
            }

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: 'greedy',
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        // Keep only rows with an actual title
                        allEvents = results.data.filter(row => {
                            const title = getFieldValue(row, 'title', 'name', 'event', 'event_title');
                            return title.length > 0;
                        });

                        if (allEvents.length === 0) {
                            document.getElementById('events-container').innerHTML = 
                                "<p style='text-align:center; padding:20px;'>Spreadsheet loaded, but no event rows were found.</p>";
                        } else {
                            renderEvents();
                        }
                    }
                }
            });
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            
            const savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            let displayEvents = allEvents;

            if (currentTab === 'saved') {
                displayEvents = displayEvents.filter((e, idx) => {
                    const eId = getFieldValue(e, 'id') || String(idx + 1);
                    return savedEvents.includes(eId);
                });
                document.getElementById('filter-container').style.display = 'none';
            } else {
                document.getElementById('filter-container').style.display = 'flex';
                if (currentFilter !== 'All') {
                    displayEvents = displayEvents.filter(e => {
                        const cat = getFieldValue(e, 'category', 'type');
                        return cat.toLowerCase().includes(currentFilter.toLowerCase());
                    });
                }
            }

            if (displayEvents.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>No events found in this view.</p>";
                return;
            }

            displayEvents.forEach((event, index) => {
                const eventId = getFieldValue(event, 'id') || String(index + 1);
                const title = getFieldValue(event, 'title', 'name', 'event', 'event_title');
                const category = getFieldValue(event, 'category', 'type');
                const dateRaw = getFieldValue(event, 'date', 'day');
                const startTime = formatTime(getFieldValue(event, 'start_time', 'start', 'time'));
                const endTime = formatTime(getFieldValue(event, 'end_time', 'end'));
                const location = getFieldValue(event, 'location', 'venue', 'address');
                const description = getFieldValue(event, 'description', 'details', 'desc');
                const rawRoute = getFieldValue(event, 'route_url', 'route', 'strava', 'gpx');
                const routeUrl = cleanUrl(rawRoute);

                const isSaved = savedEvents.includes(eventId);
                const heartClass = isSaved ? 'fas saved' : 'far';
                const dateDisplay = formatDate(dateRaw);

                const mapLink = location ? `https://maps.google.com/?q=${encodeURIComponent(location)}` : '#';

                const cardHTML = `
                    <div class="event-card">
                        <button class="fav-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${eventId}', this)">
                            <i class="${heartClass} fa-heart"></i>
                        </button>
                        
                        ${category ? `<span class="tag">${category}</span>` : ''}
                        <h3>${title}</h3>
                        
                        <div class="event-meta">
                            ${dateDisplay || startTime ? `<span><i class="far fa-calendar"></i> ${dateDisplay} ${startTime ? '\vert{} ' + startTime : ''} ${endTime ? '- ' + endTime : ''}</span>` : ''}
                            ${location ? `<span><i class="fas fa-map-marker-alt"></i> ${location}</span>` : ''}
                        </div>
                        
                        ${description ? `<div class="event-desc">${description}</div>` : ''}
                        
                        <div class="card-actions">
                            ${location ? `<a href="${mapLink}" target="_blank" class="btn"><i class="fas fa-directions"></i> Navigate</a>` : ''}
                            ${routeUrl ? `<a href="${routeUrl}" target="_blank" class="btn"><i class="fas fa-route"></i> Strava Route</a>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.toggleSave = function(id, btnElement) {
            let savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            const strId = String(id);
            
            if (savedEvents.includes(strId)) {
                savedEvents = savedEvents.filter(eventId => eventId !== strId);
                btnElement.classList.remove('saved');
                btnElement.innerHTML = '<i class="far fa-heart"></i>';
            } else {
                savedEvents.push(strId);
                btnElement.classList.add('saved');
                btnElement.innerHTML = '<i class="fas fa-heart"></i>';
            }
            
            localStorage.setItem('savedTDU', JSON.stringify(savedEvents));
            
            if (currentTab === 'saved') {
                renderEvents();
            }
        };

        window.filterEvents = function(category, element) {
            currentFilter = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
            renderEvents();
        };

        window.switchTab = function(tabName) {
            currentTab = tabName;
            document.getElementById('nav-all').classList.remove('active');
            document.getElementById('nav-saved').classList.remove('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            renderEvents();
        };

        fetchEvents();
    </script>
</body>
</html>
