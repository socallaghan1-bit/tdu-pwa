<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDU 2026 Companion</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse CSV Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary: #f26522; /* TDU Orange */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-dark: #333;
            --text-light: #666;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #events-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            position: relative;
        }

        .event-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            padding-right: 30px;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .event-meta i {
            width: 16px;
            color: var(--primary);
        }

        .event-desc {
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            background: #eee;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #555;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn:hover {
            background: #e8e8e8;
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            color: #ccc;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .fav-btn.saved {
            color: #ff3b30;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: var(--primary);
        }
        
        #loader {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>TDU 2026</h1>
        <p>Interactive Companion</p>
    </header>

    <div class="filters" id="filter-container">
        <div class="filter-btn active" onclick="filterEvents('All')">All Events</div>
        <div class="filter-btn" onclick="filterEvents('Group Ride')">Group Rides</div>
        <div class="filter-btn" onclick="filterEvents('Official Event')">Official Events</div>
        <div class="filter-btn" onclick="filterEvents('Social')">Social & Parties</div>
        <div class="filter-btn" onclick="filterEvents('Women')">Women's</div>
    </div>

    <div id="events-container">
        <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading Events...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('all')" id="nav-all">
            <i class="fas fa-calendar-alt"></i>
            Schedule
        </div>
        <div class="nav-item" onclick="switchTab('saved')" id="nav-saved">
            <i class="fas fa-heart"></i>
            My Itinerary
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_acwLQlGitpXd_GxJvx3GNjq1ZZJ80_2C7A_Xdya6z-Dn_vphi4PBa7emQqAroD1-cmwh8vscbwgA/pub?output=csv";
        
        let allEvents = [];
        let currentFilter = 'All';
        let currentTab = 'all';

        function fetchEvents() {
            // Use PapaParse download mode to bypass browser CORS fetch restrictions
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                transformHeader: h => h.trim().toLowerCase().replace(/\s+/g, '_'),
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        allEvents = results.data;
                        renderEvents();
                    } else {
                        document.getElementById('events-container').innerHTML = "<p style='text-align:center; padding:20px;'>Spreadsheet loaded, but no event rows were found.</p>";
                    }
                },
                error: function(err) {
                    console.error("PapaParse Download Error:", err);
                    document.getElementById('events-container').innerHTML = `<p style='text-align:center; padding:20px; color:red;'>Error loading sheet. Verify the Google Sheet 'Publish to Web' status.</p>`;
                }
            });
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            
            const savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            let displayEvents = allEvents;
            
            if (currentTab === 'saved') {
                displayEvents = displayEvents.filter(e => savedEvents.includes(String(e.id)));
                document.getElementById('filter-container').style.display = 'none';
            } else {
                document.getElementById('filter-container').style.display = 'flex';
                if (currentFilter !== 'All') {
                    displayEvents = displayEvents.filter(e => e.category && e.category.toLowerCase().includes(currentFilter.toLowerCase()));
                }
            }

            if (displayEvents.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>No events found.</p>";
                return;
            }

            displayEvents.forEach(event => {
                const eventId = String(event.id || '');
                const isSaved = savedEvents.includes(eventId);
                const heartClass = isSaved ? 'fas saved' : 'far';
                
                let dateDisplay = event.date || '';
                try {
                    const d = new Date(event.date);
                    if (!isNaN(d)) {
                        dateDisplay = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
                    }
                } catch(e) {}

                const mapLink = event.location ? `https://maps.google.com/?q=${encodeURIComponent(event.location)}` : '#';

                const cardHTML = `
                    <div class="event-card">
                        <button class="fav-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${eventId}', this)">
                            <i class="${heartClass} fa-heart"></i>
                        </button>
                        
                        ${event.category ? `<span class="tag">${event.category}</span>` : ''}
                        <h3>${event.title || 'Untitled Event'}</h3>
                        
                        <div class="event-meta">
                            <span><i class="far fa-calendar"></i> ${dateDisplay} ${event.start_time ? '| ' + event.start_time : ''} ${event.end_time ? '- ' + event.end_time : ''}</span>
                            <span><i class="fas fa-map-marker-alt"></i> ${event.location || 'Location TBA'}</span>
                        </div>
                        
                        ${event.description ? `<div class="event-desc">${event.description}</div>` : ''}
                        
                        <div class="card-actions">
                            ${event.location ? `<a href="${mapLink}" target="_blank" class="btn"><i class="fas fa-directions"></i> Navigate</a>` : ''}
                            ${event.route_url ? `<a href="${event.route_url}" target="_blank" class="btn"><i class="fas fa-route"></i> Route</a>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.toggleSave = function(id, btnElement) {
            let savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            const strId = String(id);
            
            if (savedEvents.includes(strId)) {
                savedEvents = savedEvents.filter(eventId => eventId !== strId);
                btnElement.classList.remove('saved');
                btnElement.innerHTML = '<i class="far fa-heart"></i>';
            } else {
                savedEvents.push(strId);
                btnElement.classList.add('saved');
                btnElement.innerHTML = '<i class="fas fa-heart"></i>';
            }
            
            localStorage.setItem('savedTDU', JSON.stringify(savedEvents));
            
            if (currentTab === 'saved') {
                renderEvents();
            }
        };

        window.filterEvents = function(category) {
            currentFilter = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderEvents();
        };

        window.switchTab = function(tabName) {
            currentTab = tabName;
            document.getElementById('nav-all').classList.remove('active');
            document.getElementById('nav-saved').classList.remove('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            renderEvents();
        };

        fetchEvents();
    </script>
</body>
</html>
