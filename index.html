<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDU 2026 Companion</title>
    <!-- Bring in an icon font (FontAwesome) for hearts and maps -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #f26522; /* TDU Orange */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-dark: #333;
            --text-light: #666;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            padding-bottom: 80px; /* Space for bottom nav */
        }

        /* HEADER */
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* CATEGORY FILTERS */
        .filters {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .filters::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }
        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* MAIN CONTAINER */
        #events-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* EVENT CARDS */
        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            position: relative;
        }

        .event-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            padding-right: 30px; /* space for heart */
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .event-meta i {
            width: 16px;
            color: var(--primary);
        }

        .event-desc {
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            background: #eee;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #555;
        }

        /* BUTTONS */
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn:hover {
            background: #e8e8e8;
        }

        /* FAVORITE HEART */
        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            color: #ccc;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .fav-btn.saved {
            color: #ff3b30;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0; /* extra padding for iPhone safe area */
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: var(--primary);
        }
        
        /* LOADING SPINNER */
        #loader {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>TDU 2026</h1>
        <p>Interactive Companion</p>
    </header>

    <!-- Filters: These categories match your Google Sheet -->
    <div class="filters" id="filter-container">
        <div class="filter-btn active" onclick="filterEvents('All')">All Events</div>
        <div class="filter-btn" onclick="filterEvents('Group Ride')">Group Rides</div>
        <div class="filter-btn" onclick="filterEvents('Official Event')">Official Events</div>
        <div class="filter-btn" onclick="filterEvents('Social')">Social & Parties</div>
        <div class="filter-btn" onclick="filterEvents('Women\'s Event')">Women's</div>
    </div>

    <div id="events-container">
        <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading Events...</div>
        <!-- Event Cards will be injected here by JavaScript -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('all')" id="nav-all">
            <i class="fas fa-calendar-alt"></i>
            Schedule
        </div>
        <div class="nav-item" onclick="switchTab('saved')" id="nav-saved">
            <i class="fas fa-heart"></i>
            My Itinerary
        </div>
    </div>

    <script>
        // Your Google Sheets CSV Link
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_acwLQlGitpXd_GxJvx3GNjq1ZZJ80_2C7A_Xdya6z-Dn_vphi4PBa7emQqAroD1-cmwh8vscbwgA/pub?output=csv";
        
        let allEvents = [];
        let currentFilter = 'All';
        let currentTab = 'all'; // 'all' or 'saved'

        // 1. Fetch data when page loads
        async function fetchEvents() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                allEvents = parseCSV(data);
                renderEvents();
            } catch (error) {
                document.getElementById('events-container').innerHTML = "<p style='text-align:center; padding:20px;'>Could not load events. Check your connection.</p>";
            }
        }

        // 2. Simple CSV parser
        function parseCSV(str) {
            const lines = str.split('\n');
            const result = [];
            // Assuming Row 1 is headers: id,title,category,date,start_time,end_time,location,description,route_url
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            for(let i = 1; i < lines.length; i++) {
                if(!lines[i].trim()) continue;
                // Handling basic CSV splitting (Note: complex commas inside quotes aren't handled in this basic version)
                const obj = {};
                const currentline = lines[i].split(',');
                
                headers.forEach((header, index) => {
                    obj[header] = currentline[index] ? currentline[index].trim() : '';
                });
                result.push(obj);
            }
            return result;
        }

        // 3. Render the Event Cards to the screen
        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = ''; // Clear loader
            
            // Get saved IDs from local storage
            const savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');

            // Filter logic
            let displayEvents = allEvents;
            
            // If viewing "My Itinerary" tab, only show saved
            if(currentTab === 'saved') {
                displayEvents = displayEvents.filter(e => savedEvents.includes(e.id));
                document.getElementById('filter-container').style.display = 'none'; // hide top filters
            } else {
                document.getElementById('filter-container').style.display = 'flex'; // show top filters
                // Apply category filter if not "All"
                if(currentFilter !== 'All') {
                    displayEvents = displayEvents.filter(e => e.category && e.category.includes(currentFilter));
                }
            }

            if(displayEvents.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>No events found.</p>";
                return;
            }

            // Build HTML for each event
            displayEvents.forEach(event => {
                const isSaved = savedEvents.includes(event.id);
                const heartClass = isSaved ? 'fas saved' : 'far';
                
                // Format Date nicely (assuming YYYY-MM-DD input)
                let dateDisplay = event.date;
                try {
                    const d = new Date(event.date);
                    if(!isNaN(d)) {
                        dateDisplay = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
                    }
                } catch(e) {}

                // Create Map Link
                const mapLink = event.location ? `https://maps.google.com/?q=${encodeURIComponent(event.location)}` : '#';

                const cardHTML = `
                    <div class="event-card">
                        <button class="fav-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${event.id}', this)">
                            <i class="${heartClass} fa-heart"></i>
                        </button>
                        
                        ${event.category ? `<span class="tag">${event.category}</span>` : ''}
                        <h3>${event.title}</h3>
                        
                        <div class="event-meta">
                            <span><i class="far fa-calendar"></i> ${dateDisplay} | ${event.start_time} ${event.end_time ? '- ' + event.end_time : ''}</span>
                            <span><i class="fas fa-map-marker-alt"></i> ${event.location || 'TBA'}</span>
                        </div>
                        
                        ${event.description ? `<div class="event-desc">${event.description}</div>` : ''}
                        
                        <div class="card-actions">
                            ${event.location ? `<a href="${mapLink}" target="_blank" class="btn"><i class="fas fa-directions"></i> Navigate</a>` : ''}
                            ${event.route_url ? `<a href="${event.route_url}" target="_blank" class="btn"><i class="fas fa-route"></i> Route</a>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // 4. Save/Unsave Events to Local Storage (No Login required!)
        window.toggleSave = function(id, btnElement) {
            let savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            
            if(savedEvents.includes(id)) {
                // Remove it
                savedEvents = savedEvents.filter(eventId => eventId !== id);
                btnElement.classList.remove('saved');
                btnElement.innerHTML = '<i class="far fa-heart"></i>';
            } else {
                // Add it
                savedEvents.push(id);
                btnElement.classList.add('saved');
                btnElement.innerHTML = '<i class="fas fa-heart"></i>';
            }
            
            localStorage.setItem('savedTDU', JSON.stringify(savedEvents));
            
            // If we are currently on the 'saved' tab, re-render immediately to remove the un-hearted card
            if(currentTab === 'saved') {
                renderEvents();
            }
        };

        // 5. Category Filtering
        window.filterEvents = function(category) {
            currentFilter = category;
            
            // Update active button styling
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderEvents();
        };

        // 6. Bottom Navigation Tabs
        window.switchTab = function(tabName) {
            currentTab = tabName;
            
            // Update active icon styling
            document.getElementById('nav-all').classList.remove('active');
            document.getElementById('nav-saved').classList.remove('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            
            renderEvents();
        };

        // Initialize App
        fetchEvents();
    </script>
</body>
</html>
