<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDU 2026 Companion</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse CSV Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary: #f26522; /* TDU Orange */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-dark: #333;
            --text-light: #666;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            background: white;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #events-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            position: relative;
        }

        .event-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            padding-right: 30px;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .event-meta i {
            width: 16px;
            color: var(--primary);
        }

        .event-desc {
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            background: #eee;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #555;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn:hover {
            background: #e8e8e8;
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            color: #ccc;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .fav-btn.saved {
            color: #ff3b30;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: var(--primary);
        }
        
        #loader {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>TDU 2026</h1>
        <p>Interactive Companion</p>
    </header>

    <div class="filters" id="filter-container">
        <div class="filter-btn active" onclick="filterEvents('All')">All Events</div>
        <div class="filter-btn" onclick="filterEvents('Group Ride')">Group Rides</div>
        <div class="filter-btn" onclick="filterEvents('Official Event')">Official Events</div>
        <div class="filter-btn" onclick="filterEvents('Social')">Social & Parties</div>
        <div class="filter-btn" onclick="filterEvents('Women')">Women's</div>
    </div>

    <div id="events-container">
        <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading Events...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('all')" id="nav-all">
            <i class="fas fa-calendar-alt"></i>
            Schedule
        </div>
        <div class="nav-item" onclick="switchTab('saved')" id="nav-saved">
            <i class="fas fa-heart"></i>
            My Itinerary
        </div>
    </div>

    <script>
        const RAW_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_acwLQlGitpXd_GxJvx3GNjq1ZZJ80_2C7A_Xdya6z-Dn_vphi4PBa7emQqAroD1-cmwh8vscbwgA/pub?output=csv";
        const PROXY_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(RAW_SHEET_URL);
        
        let allEvents = [];
        let currentFilter = 'All';
        let currentTab = 'all';

        // Smart field lookup: handles column names regardless of case or spacing
        function getFieldValue(obj, ...possibleKeys) {
            if (!obj) return '';
            const normalizedKeys = possibleKeys.map(k => k.toLowerCase().replace(/[^a-z0-9]/g, ''));
            for (let prop in obj) {
                const normProp = prop.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (normalizedKeys.includes(normProp) && obj[prop]) {
                    return String(obj[prop]).trim();
                }
            }
            return '';
        }

        async function fetchEvents() {
            try {
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error("Could not connect to Google Sheet server.");
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            allEvents = results.data;
                            renderEvents();
                        } else {
                            document.getElementById('events-container').innerHTML = "<p style='text-align:center; padding:20px;'>Sheet connected, but no event rows were found!</p>";
                        }
                    }
                });
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('events-container').innerHTML = `<p style='text-align:center; padding:20px; color:red;'>Error: ${error.message}</p>`;
            }
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            
            const savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            let displayEvents = allEvents;

            if (currentTab === 'saved') {
                displayEvents = displayEvents.filter((e, idx) => {
                    const eId = getFieldValue(e, 'id') || String(idx + 1);
                    return savedEvents.includes(eId);
                });
                document.getElementById('filter-container').style.display = 'none';
            } else {
                document.getElementById('filter-container').style.display = 'flex';
                if (currentFilter !== 'All') {
                    displayEvents = displayEvents.filter(e => {
                        const cat = getFieldValue(e, 'category', 'type');
                        return cat.toLowerCase().includes(currentFilter.toLowerCase());
                    });
                }
            }

            if (displayEvents.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>No events found in this view.</p>";
                return;
            }

            displayEvents.forEach((event, index) => {
                const eventId = getFieldValue(event, 'id') || String(index + 1);
                const title = getFieldValue(event, 'title', 'name', 'event', 'event_title') || 'TDU Event';
                const category = getFieldValue(event, 'category', 'type');
                const dateRaw = getFieldValue(event, 'date', 'day');
                const startTime = getFieldValue(event, 'start_time', 'start', 'time');
                const endTime = getFieldValue(event, 'end_time', 'end');
                const location = getFieldValue(event, 'location', 'venue', 'address');
                const description = getFieldValue(event, 'description', 'details', 'desc');
                const routeUrl = getFieldValue(event, 'route_url', 'route', 'strava', 'gpx');

                const isSaved = savedEvents.includes(eventId);
                const heartClass = isSaved ? 'fas saved' : 'far';
                
                let dateDisplay = dateRaw;
                try {
                    const d = new Date(dateRaw);
                    if (!isNaN(d)) {
                        dateDisplay = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
                    }
                } catch(e) {}

                const mapLink = location ? `https://maps.google.com/?q=${encodeURIComponent(location)}` : '#';

                const cardHTML = `
                    <div class="event-card">
                        <button class="fav-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${eventId}', this)">
                            <i class="${heartClass} fa-heart"></i>
                        </button>
                        
                        ${category ? `<span class="tag">${category}</span>` : ''}
                        <h3>${title}</h3>
                        
                        <div class="event-meta">
                            ${dateDisplay || startTime ? `<span><i class="far fa-calendar"></i> ${dateDisplay} ${startTime ? '\vert{} ' + startTime : ''} ${endTime ? '- ' + endTime : ''}</span>` : ''}
                            ${location ? `<span><i class="fas fa-map-marker-alt"></i> ${location}</span>` : ''}
                        </div>
                        
                        ${description ? `<div class="event-desc">${description}</div>` : ''}
                        
                        <div class="card-actions">
                            ${location ? `<a href="${mapLink}" target="_blank" class="btn"><i class="fas fa-directions"></i> Navigate</a>` : ''}
                            ${routeUrl ? `<a href="${routeUrl}" target="_blank" class="btn"><i class="fas fa-route"></i> Route</a>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        window.toggleSave = function(id, btnElement) {
            let savedEvents = JSON.parse(localStorage.getItem('savedTDU') || '[]');
            const strId = String(id);
            
            if (savedEvents.includes(strId)) {
                savedEvents = savedEvents.filter(eventId => eventId !== strId);
                btnElement.classList.remove('saved');
                btnElement.innerHTML = '<i class="far fa-heart"></i>';
            } else {
                savedEvents.push(strId);
                btnElement.classList.add('saved');
                btnElement.innerHTML = '<i class="fas fa-heart"></i>';
            }
            
            localStorage.setItem('savedTDU', JSON.stringify(savedEvents));
            
            if (currentTab === 'saved') {
                renderEvents();
            }
        };

        window.filterEvents = function(category) {
            currentFilter = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderEvents();
        };

        window.switchTab = function(tabName) {
            currentTab = tabName;
            document.getElementById('nav-all').classList.remove('active');
            document.getElementById('nav-saved').classList.remove('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            renderEvents();
        };

        fetchEvents();
    </script>
</body>
</html>
